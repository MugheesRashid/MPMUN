<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulk ID Card Generator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap');

        :root {
            --bg: #0C1A26;
            --bg-elevated: #12222F;
            --border: rgba(132, 151, 169, 0.20);
            --text-primary: #E3E8EC;
            --font-heading: 'Manrope', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
        }

        h3,
        h4 {
            font-family: var(--font-heading);
            color: var(--text-primary);
        }

        .btn {
            font-family: var(--font-heading);
            font-weight: 600;
            border-radius: 10px;
        }

        .btn-primary {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg);
        }

        .btn-primary:hover {
            background: #F3F6F8;
            color: var(--bg);
        }

        .btn-success {
            background: #34D399;
            border-color: #34D399;
            color: #0C1A26;
        }

        .btn-danger {
            background: #F87171;
            border-color: #F87171;
            color: #0C1A26;
        }

        #cardsContainer {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }

        /* Card Container Frame */
        .id-card-element {
            width: 320px;
            height: 480px;
            position: relative;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        /* High-Res Background Image Layer */
        .card-bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Photo Frame */
        .photo-square-box {
            position: absolute;
            bottom: 26.9%;
            left: 50%;
            transform: translateX(-50%);
            width: 210px;
            height: 221px;
            overflow: hidden;
            z-index: 2;
            background: #ffffff;
        }

        .photo-square-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Text Layer */
        .text-container {
            position: absolute;
            bottom: 15%;
            left: 5%;
            right: 5%;
            text-align: left;
            z-index: 2;
        }

        .card-name {
            font-size: 18px;
            font-weight: 700;
            color: #BFEB0B;
            width: 70%;
            margin: 0;
            line-height: 1.25;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            word-wrap: break-word;
        }

        .card-committee {
            font-size: 14px;
            font-weight: 500;
            color: #FBFCFD;
            margin-top: 4px;
            line-height: 1.2;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        #progressBar {
            height: 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin: 14px 0 8px;
        }

        #progressFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #8497A9, #E3E8EC);
            transition: width 0.2s linear;
        }

        select.custom-select {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.375rem 0.75rem;
        }
        select.custom-select:focus {
            outline: none;
            border-color: #8497A9;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-xl font-semibold">Bulk ID Card Generator</h3>
            <div class="flex gap-2">
                <button id="downloadPdfBtn" class="btn btn-primary" disabled>Download PDF</button>
                <button id="downloadZipBtn" class="btn btn-success" disabled>Download Ultra-HD PNGs (ZIP)</button>
                <button id="stopBtn" class="btn btn-danger" style="display:none;">Stop</button>
            </div>
        </div>

        <div class="mb-4 p-3 rounded flex flex-col md:flex-row gap-4 justify-between items-start md:items-center" style="background: var(--bg-elevated); border: 1px solid var(--border);">
            <div class="w-full md:w-1/2">
                <label class="block mb-2 font-medium text-sm text-gray-300">Upload Excel File (idcard.xlsx)</label>
                <input type="file" id="excelInput" accept=".xlsx, .xls"
                    class="block w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white" />
            </div>
            
            <div class="w-full md:w-1/3">
                <label class="block mb-2 font-medium text-sm text-gray-300">Select Card Type</label>
                <select id="cardTypeSelect" class="form-select custom-select w-full">
                    <option value="delegate.png" selected>Delegate</option>
                    <option value="observer.png">Observer</option>
                    <option value="delegation.jpeg">Delegation</option>
                </select>
            </div>
        </div>

        <div id="progressBar">
            <div id="progressFill"></div>
        </div>
        <small id="statusText" class="text-gray-400">Please select an Excel file to begin</small>

        <!-- Preview Section -->
        <div class="mt-6 flex flex-col items-center">
            <h4 class="text-lg mb-2 text-gray-300">Preview</h4>
            <div class="id-card-element shadow-2xl">
                <img id="previewBg" src="delegate.png" class="card-bg-layer" alt="Background" />
                <div class="photo-square-box">
                    <img id="previewPhoto" src="https://via.placeholder.com/150" alt="Delegate Photo" />
                </div>
                <div class="text-container">
                    <p class="card-name" id="previewName">Muhammad Abdullah Khan</p>
                    <p class="card-committee" id="previewCommittee">Executive Directorate</p>
                </div>
            </div>
        </div>

        <div id="cardsContainer"></div>
    </div>

    <!-- Required Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        const { jsPDF } = window.jspdf;

        const excelInput = document.getElementById("excelInput");
        const cardTypeSelect = document.getElementById("cardTypeSelect");
        const previewBg = document.getElementById("previewBg");
        const downloadPdfBtn = document.getElementById("downloadPdfBtn");
        const downloadZipBtn = document.getElementById("downloadZipBtn");
        const stopBtn = document.getElementById("stopBtn");
        const progressFill = document.getElementById("progressFill");
        const statusText = document.getElementById("statusText");
        const cardsContainer = document.getElementById("cardsContainer");

        let parsedUsers = [];
        let stopRequested = false;

        // Change preview background on card type dropdown change
        cardTypeSelect.addEventListener("change", (e) => {
            previewBg.src = e.target.value;
        });

        // Formats long names: Wraps the last part to a new line if longer than 19 characters
        function formatName(nameStr, maxLength = 19) {
            if (!nameStr) return '';
            const trimmed = String(nameStr).trim();
            if (trimmed.length > maxLength) {
                const lastSpaceIndex = trimmed.lastIndexOf(' ');
                if (lastSpaceIndex !== -1) {
                    return trimmed.substring(0, lastSpaceIndex) + '<br>' + trimmed.substring(lastSpaceIndex + 1);
                }
            }
            return trimmed;
        }

        excelInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (evt) => {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: "array" });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                parsedUsers = XLSX.utils.sheet_to_json(firstSheet);

                if (parsedUsers.length > 0) {
                    const first = parsedUsers[0];
                    const rawName = first.Name || first.name || "N/A";
                    document.getElementById("previewName").innerHTML = formatName(rawName);
                    document.getElementById("previewCommittee").textContent = first.Committee || first.committee || "N/A";

                    const rawImgUrl = first.Picture || first.picture || first.Image || first.image || 'https://via.placeholder.com/150';
                    document.getElementById("previewPhoto").src = rawImgUrl;

                    downloadPdfBtn.disabled = false;
                    downloadZipBtn.disabled = false;
                    statusText.textContent = `Loaded ${parsedUsers.length} records. Ready to generate files.`;
                }
            };
            reader.readAsArrayBuffer(file);
        });

        async function processBatch(formatType) {
            stopRequested = false;
            stopBtn.style.display = "inline-block";
            downloadPdfBtn.disabled = true;
            downloadZipBtn.disabled = true;

            const selectedBgImage = cardTypeSelect.value;
            const total = parsedUsers.length;
            const pdf = formatType === 'pdf' ? new jsPDF({ orientation: "portrait", unit: "mm", format: [85.6, 120] }) : null;
            const zip = formatType === 'zip' ? new JSZip() : null;

            for (let i = 0; i < total; i++) {
                if (stopRequested) break;

                const user = parsedUsers[i];
                const rawPhotoUrl = user.Picture || user.picture || user.Image || user.image || 'https://via.placeholder.com/150';
                const rawName = user.Name || user.name || '';
                const formattedName = formatName(rawName);

                // Build HTML Structure dynamically using the selected card background
                const cardEl = document.createElement("div");
                cardEl.className = "id-card-element";
                cardEl.innerHTML = `
                    <img src="${selectedBgImage}" class="card-bg-layer" alt="BG" />
                    <div class="photo-square-box">
                        <img src="https://mutasil.pk/templates/${rawPhotoUrl}" alt="Photo" />
                    </div>
                    <div class="text-container">
                        <p class="card-name">${formattedName}</p>
                        <p class="card-committee">${user.Committee || user.committee || ''}</p>
                    </div>
                `;
                cardsContainer.appendChild(cardEl);

                // Wait for image render
                await new Promise(r => setTimeout(r, 100));

                // Ultra High-Res Canvas Capture (4x Scale)
                const canvas = await html2canvas(cardEl, {
                    scale: 4,
                    useCORS: true,
                    allowTaint: true,
                    logging: false,
                    imageTimeout: 0
                });

                if (formatType === 'pdf') {
                    const imgData = canvas.toDataURL("image/jpeg", 1.0);
                    if (i > 0) pdf.addPage([85.6, 120], "portrait");
                    pdf.addImage(imgData, "JPEG", 0, 0, 85.6, 120, undefined, 'NONE');
                } else if (formatType === 'zip') {
                    const blob = await new Promise(res => canvas.toBlob(res, 'image/png', 1.0));
                    const fileName = `${rawName || 'Delegate'}_${i + 1}.png`.replace(/[^a-zA-Z0-9_\-.]/g, "_");
                    zip.file(fileName, blob);
                }

                cardsContainer.removeChild(cardEl);

                const pct = Math.round(((i + 1) / total) * 100);
                progressFill.style.width = pct + "%";
                statusText.textContent = `Processing ${i + 1}/${total} (${pct}%)`;
            }

            if (!stopRequested) {
                if (formatType === 'pdf') {
                    statusText.textContent = "Finalizing PDF...";
                    pdf.save("ID_Cards_UltraHD.pdf");
                } else if (formatType === 'zip') {
                    statusText.textContent = "Packaging ZIP...";
                    const zipBlob = await zip.generateAsync({ type: "blob" });
                    saveAs(zipBlob, "ID_Cards_UltraHD_PNG.zip");
                }
                statusText.textContent = "Export Finished Successfully ✅";
            } else {
                statusText.textContent = "Export Stopped by User.";
            }

            stopBtn.style.display = "none";
            downloadPdfBtn.disabled = false;
            downloadZipBtn.disabled = false;
        }

        downloadPdfBtn.addEventListener("click", () => processBatch('pdf'));
        downloadZipBtn.addEventListener("click", () => processBatch('zip'));
        stopBtn.addEventListener("click", () => { stopRequested = true; });
    </script>
</body>

</html>
